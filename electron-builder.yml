appId: com.alisher.glowlab
productName: GlowLab
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Dasturchi fayllari ilovaga kirmaydi (testlar, ML notebooklar, hujjatlar, agent sozlamalari)
  - '!{e2e,e2e-results,ml,ai-docs,scripts,docs,skills,_to_delete,.claude,.agents}/**'
  - '!{vitest.config.mts,playwright.config.ts,CLAUDE.md,skills-lock.json,*.tsbuildinfo,.nvmrc}'
  - '!{playwright-report,test-results}/**'
  # onnxruntime-node hamma platformalar binarini olib keladi (~295 MB) → faqat build qilinayotgan platformaniki qoladi.
  # Diqqat: platforma bo'limida (mac:) `files` yozilmaydi — u bu umumiy ro'yxatni to'liq ALMASHTIRADI
  - '!node_modules/onnxruntime-node/bin/napi-v6/!(${platform})/**'
asarUnpack:
  - resources/**
  - node_modules/onnxruntime-node/** # Native .node + .dylib asar ichidan yuklanmaydi
  - node_modules/sqlite-vec-*/** # sqlite-vec kengaytmasi (.dylib) ham asar ichidan yuklanmaydi
win:
  executableName: GlowLab
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  # extendInfo ro'yxat emas, map bo'lishi kerak — aks holda Electron'ning standart matni chiqadi
  extendInfo:
    NSCameraUsageDescription: GlowLab uses the camera only for local skin analysis. Photos never leave your computer.
  # Apple Developer ID yo'q → ad-hoc imzo: yuklab olingan ilova "shikastlangan" emas, "noma'lum dasturchi" deb ko'rinadi
  identity: '-'
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Bakhriddinov Alisher
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
